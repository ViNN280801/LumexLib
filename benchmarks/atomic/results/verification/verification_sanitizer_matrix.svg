<text x="20.0" y="52.0" font-size="12" text-anchor="start" font-weight="normal" fill="#4a5568">One row per compiler, library and sanitizer; the columns are those of the table in the README.</text>
<text x="20.0" y="69.0" font-size="12" text-anchor="start" font-weight="normal" fill="#4a5568">A cell is the passed, failed and skipped tests of the run; xN = N seeds. Skipped tests are not passed tests.</text>
